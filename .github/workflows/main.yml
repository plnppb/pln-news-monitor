name: Auto Crawl PLN Papua

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # Setiap 6 jam
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Crawl RSS Feeds (semua sumber, termasuk Infonesia)
        run: |
          SECRET="${{ secrets.CRON_SECRET }}"
          BASE="https://pln-news-monitor.vercel.app/api/crawl"
          BATCH_SIZE=30
          TOTAL_FEEDS=100
          TOTAL_BATCHES=$(( (TOTAL_FEEDS + BATCH_SIZE - 1) / BATCH_SIZE ))

          for i in $(seq 0 $((TOTAL_BATCHES - 1))); do
            echo "Crawling RSS batch $i..."
            RESULT=$(curl -s "${BASE}?secret=${SECRET}&keyword=PLN+Papua&batchIndex=${i}&batch=${BATCH_SIZE}")
            echo "Batch $i: $RESULT"
            sleep 3
          done

          echo "RSS feeds crawl done!"

      - name: Crawl External Sources (NewsAPI + Google News + GNews.io)
        run: |
          SECRET="${{ secrets.CRON_SECRET }}"
          BASE="https://pln-news-monitor.vercel.app/api/crawl"

          echo "Mengambil daftar kata kunci aktif dari database..."
          KEYWORDS=$(curl -s "https://pln-news-monitor.vercel.app/api/feeds?resource=keywords" | jq -r '.keywords[] | select(.enabled==true) | .keyword')

          if [ -z "$KEYWORDS" ]; then
            echo "Tidak ada kata kunci aktif di database, pakai default 'PLN Papua'"
            KEYWORDS="PLN Papua"
          fi

          echo "$KEYWORDS" | while IFS= read -r KW; do
            [ -z "$KW" ] && continue
            ENCODED_KW=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$KW")
            echo "Keyword: $KW"
            RESULT=$(curl -s "${BASE}?secret=${SECRET}&keyword=${ENCODED_KW}&source=external")
            echo "Result: $RESULT"
            sleep 4
          done

          echo "External sources crawl done!"

      - name: Crawl Radar Papua (berita umum, di luar konteks PLN)
        run: |
          SECRET="${{ secrets.CRON_SECRET }}"
          BASE="https://pln-news-monitor.vercel.app/api/crawl"
          RESULT=$(curl -s "${BASE}?secret=${SECRET}&keyword=Papua&source=radar")
          echo "Radar Papua: $RESULT"

      - name: Analyze New Articles
        run: |
          SECRET="${{ secrets.CRON_SECRET }}"
          echo "Running analyze batch (batch kecil, biar tidak timeout 10 detik Vercel Hobby)..."
          for i in $(seq 1 150); do
            RESULT=$(curl -s "https://pln-news-monitor.vercel.app/api/analyze-batch?secret=${SECRET}&batch=2")
            echo "Batch $i: $RESULT"
            if echo "$RESULT" | grep -q "Semua artikel sudah dianalisis"; then
              echo "Semua artikel sudah dianalisis, berhenti."
              break
            fi
            sleep 9
          done
          echo "Analyze done!"
